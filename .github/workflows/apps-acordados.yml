name: Os apps ao vivo continuam de pé?

# POR QUE ESTE WORKFLOW EXISTE
# ----------------------------
# Dos nove cartões do site, só dois têm link "Ver ao vivo": os apps Streamlit.
# Em 2026-09-02 os DOIS estavam dormindo — o Streamlit Community Cloud hiberna
# app depois de ~7 dias sem visita, e quem clicasse via uma tela cinza pedindo
# para acordar o app.
#
# Link quebrado é pior que link ausente: ausência é só ausência, enquanto uma
# tela de "este app está dormindo" dá sinal ativo de portfólio abandonado — e
# é justamente no clique do "Ver ao vivo" que o visitante estava mais
# interessado.
#
# Este workflow faz tres coisas:
#
#   1. VISITA os dois apps a cada seis horas, para a hibernacao nao comecar;
#   2. ACORDA o app se ele ja estiver dormindo: o script clica em "Yes, get
#      this app back up!" e espera subir;
#   3. CONFERE a TELA, num Chromium de verdade. A checagem por `curl` em
#      `/_stcore/health` que existia aqui reprovava os dois apps todo dia,
#      inclusive com os dois no ar: o endpoint responde 303 para quem nao tem
#      cookie de sessao, e, seguindo o redirecionamento, responde os mesmos
#      9.426 bytes acordado ou dormindo. O detalhe esta em tools/conferir_apps.py.
#
# POR QUE SEIS HORAS (2026-10-11). O intervalo era de dois dias, calculado para
# um prazo de hibernacao de ~7 dias. O historico desta propria rotina mostrou
# que o prazo e bem menor: em 21/09 os dois apps estavam de pe e em 23/09 os
# dois dormiam — e ela falhou em todas as execucoes dali ate 09/10. Seis horas
# da quatro visitas por dia; se uma se perder, a seguinte ainda acorda o app.
#
# Se este workflow ficar vermelho agora, o app nao subiu nem depois do clique:
# ai e erro do app (dependencia, build), e uma pessoa precisa olhar.
#
# O GitHub desliga workflow agendado em repositorio sem commit ha 60 dias.

on:
  schedule:
    # A cada seis horas, no minuto 10. Minuto quebrado de propósito: o
    # agendador do GitHub atrasa execuções marcadas na hora cheia.
    - cron: "10 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visitar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # O veredito precisa de navegador: a tela de hibernacao do Streamlit e
      # desenhada por JavaScript, e o app real roda dentro de um iframe. Ver o
      # cabecalho de tools/conferir_apps.py para o historico dos dois falsos
      # negativos que a versao por curl produzia.
      - name: Instala o Chromium do Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Cada link "Ver ao vivo" do site abre para um visitante?
        run: python tools/conferir_apps.py
