name: Os apps ao vivo continuam de pé?

# POR QUE ESTE WORKFLOW EXISTE
# ----------------------------
# Dos nove cartões do site, só dois têm link "Ver ao vivo": os apps Streamlit.
# Em 2026-09-02 os DOIS estavam dormindo — o Streamlit Community Cloud hiberna
# app depois de ~7 dias sem visita, e quem clicasse via uma tela cinza pedindo
# para acordar o app.
#
# Link quebrado é pior que link ausente: ausência é só ausência, enquanto uma
# tela de "este app está dormindo" dá sinal ativo de portfólio abandonado — e
# é justamente no clique do "Ver ao vivo" que o visitante estava mais
# interessado.
#
# Este workflow faz duas coisas, e a primeira é a que resolve:
#
#   1. VISITA os dois apps a cada dois dias. A hibernação conta dias sem
#      tráfego, então uma visita periódica impede que ela comece;
#   2. CONFERE `/_stcore/health`, que devolve 200 num app de pé e 303 (redireção
#      para a tela de autenticação) num app dormindo. Se algum estiver dormindo,
#      a execução falha — e a falha chega por e-mail, que é o aviso que não
#      existia antes.
#
# O intervalo é de dois dias, não sete: assim há três chances de acordar antes
# de a hibernação acontecer, e uma execução perdida não derruba o link.
#
# ATENÇÃO: este workflow NÃO acorda um app que já dormiu. Acordar exige apertar
# o botão na página, o que só uma pessoa faz. Ele impede o app de dormir e avisa
# quando dormiu.

on:
  schedule:
    # 09:10 UTC = 06:10 em Brasília. Minuto quebrado de propósito: o agendador
    # do GitHub atrasa execuções marcadas na hora cheia, quando a fila é maior.
    - cron: "10 9 */2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visitar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Visita e confere cada app anunciado pelo site
        run: |
          set -uo pipefail

          # As URLs saem de projects.ts, e não de uma lista escrita aqui: se um
          # cartão ganhar ou perder o "Ver ao vivo", este workflow acompanha
          # sozinho. Mesmo princípio de tools/conferir_repos.py.
          APPS=$(grep -oE 'liveUrl: "[^"]+"' src/data/projects.ts \
                 | grep -oE 'https://[^"]+' | sort -u)

          if [ -z "$APPS" ]; then
            echo "Nenhum liveUrl em src/data/projects.ts — nada a vigiar."
            exit 0
          fi

          falhas=0
          for app in $APPS; do
            # A visita à raiz é o que conta como tráfego e adia a hibernação.
            curl -s -o /dev/null -L --max-time 60 "$app" || true

            saude="${app%/}/_stcore/health"
            codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$saude")

            if [ "$codigo" = "200" ]; then
              echo "  de pé      $app"
            else
              echo "  DORMINDO   $app  (health devolveu $codigo, esperado 200)"
              falhas=$((falhas + 1))
            fi
          done

          echo
          if [ "$falhas" -gt 0 ]; then
            echo "$falhas app(s) fora do ar."
            echo "Para acordar: abra o link e clique em \"Yes, get this app back up\"."
            echo "Leva ~30s. Depois disso este workflow segura o app acordado sozinho."
            exit 1
          fi
          echo "Todos os apps anunciados pelo site estão de pé."
