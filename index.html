<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Geist+Mono:wght@400;500&display=swap" />
    <meta name="description" content="Hugo Nazário — Analista de Dados Pleno. SQL, Python, Power BI e Machine Learning." />
    <title>Hugo Nazário · Analista de Dados</title>

    <!-- Open Graph. O canal de divulgação deste site é o LinkedIn, e sem estas
         tags o card do post sai em branco: sem título, sem imagem, sem resumo.
         `og:image` precisa de URL ABSOLUTA — caminho relativo não é resolvido
         pelo crawler, que não carrega a página. -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Hugo Nazário" />
    <meta property="og:locale"      content="pt_BR" />
    <meta property="og:url"         content="https://hugonazario.com/" />
    <meta property="og:title"       content="Hugo Nazário · Analista de Dados" />
    <meta property="og:description" content="SQL, Python, Power BI e Machine Learning aplicados a telecom. Oito projetos públicos e uma plataforma interna, do dado bruto ao painel de decisão." />
    <meta property="og:image"       content="https://hugonazario.com/og-card-v5.png" />
    <!-- O NOME TEM VERSAO (2026-09-03). O LinkedIn guarda a imagem em cache
         pela URL dela, por dias, e nao ha mais ferramenta publica para forcar
         a releitura: o Post Inspector foi desativado. O card publicado em
         02/09 dizia "unico analista" e estampava o dominio antigo, e continuou
         aparecendo assim depois de a imagem ser corrigida no lugar. Trocar o
         nome do arquivo e a unica forma confiavel de o robo buscar de novo.
         Regra: toda vez que o conteudo do card mudar, sobe a versao aqui e em
         tools/gerar_og.py.

         Dimensoes declaradas: sem elas o LinkedIn as vezes serve o card
         pequeno na primeira renderizacao, antes de baixar a imagem. -->
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="Hugo Nazário, Analista de Dados Pleno — 8 projetos públicos, 150 testes em CI, 3 sobre dado observado" />
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Hugo Nazário · Analista de Dados" />
    <meta name="twitter:description" content="SQL, Python, Power BI e Machine Learning aplicados a telecom. Oito projetos públicos e uma plataforma interna, do dado bruto ao painel de decisão." />
    <meta name="twitter:image"       content="https://hugonazario.com/og-card-v5.png" />
  </head>
  <body>
    <!--
      THESIS: o site é escrito pela mesma caneta da logo. Recusa o portfólio de cartões com ícone e a abertura de cartaz colorido.
      OWN-WORLD: preto quente #0b0a0a, tinta #ede8e3, um acento azul #2F6BD8 só como traço e superfície; Archivo em larguras estreita (títulos) e larga (rótulos), Geist Mono só em dado; fios de 1px, cantos de 4-6px, nenhuma sombra decorativa.
      STORY: o tech lead reconhece a pessoa, lê o escopo em uma frase, desce aos projetos com a procedência do dado colada ao título e abre o repositório.
      FIRST VIEWPORT: nome em duas linhas à esquerda (até 6rem), cargo, uma frase e o botão azul "Ver projetos"; à direita a foto redonda em P&B com o círculo cortado da logo se desenhando em volta.
      FORM: direção fixada pelo Hugo (preto, minimalismo, azul, logo Hn); sem sorteio de conceito. Assinatura: traço de caneta (logo no contato, fio sob cada título, linha da trajetória presa ao scroll).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
