<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hugo Leonardo — Analista de Dados Pleno. SQL, Python, Power BI e Machine Learning." />
    <title>Hugo Leonardo · Analista de Dados</title>

    <!-- Open Graph. O canal de divulgação deste site é o LinkedIn, e sem estas
         tags o card do post sai em branco: sem título, sem imagem, sem resumo.
         `og:image` precisa de URL ABSOLUTA — caminho relativo não é resolvido
         pelo crawler, que não carrega a página. -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Hugo Leonardo" />
    <meta property="og:locale"      content="pt_BR" />
    <meta property="og:url"         content="https://hugoleonardonz.github.io/portfolio/" />
    <meta property="og:title"       content="Hugo Leonardo · Analista de Dados" />
    <meta property="og:description" content="SQL, Python, Power BI e Machine Learning aplicados a telecom. Sete projetos públicos e uma plataforma interna, do dado bruto ao painel de decisão." />
    <meta property="og:image"       content="https://hugoleonardonz.github.io/portfolio/hugo-foto.png" />
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Hugo Leonardo · Analista de Dados" />
    <meta name="twitter:description" content="SQL, Python, Power BI e Machine Learning aplicados a telecom. Sete projetos públicos e uma plataforma interna, do dado bruto ao painel de decisão." />
    <meta name="twitter:image"       content="https://hugoleonardonz.github.io/portfolio/hugo-foto.png" />
  </head>
